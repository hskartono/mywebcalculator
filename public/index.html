<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kalkulator</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="calculator">
    <div class="display" id="display" role="status" aria-live="polite">0</div>
    <div class="buttons">
      <button type="button" class="btn btn-clear" data-action="clear" aria-label="Clear">C</button>
      <button type="button" class="btn btn-op" data-action="operator" data-value="/" aria-label="Divide">÷</button>
      <button type="button" class="btn btn-op" data-action="operator" data-value="*" aria-label="Multiply">×</button>
      <button type="button" class="btn btn-op" data-action="operator" data-value="-" aria-label="Subtract">−</button>

      <button type="button" class="btn btn-digit" data-action="digit" data-value="7">7</button>
      <button type="button" class="btn btn-digit" data-action="digit" data-value="8">8</button>
      <button type="button" class="btn btn-digit" data-action="digit" data-value="9">9</button>
      <button type="button" class="btn btn-op btn-plus" data-action="operator" data-value="+" aria-label="Add">+</button>

      <button type="button" class="btn btn-digit" data-action="digit" data-value="4">4</button>
      <button type="button" class="btn btn-digit" data-action="digit" data-value="5">5</button>
      <button type="button" class="btn btn-digit" data-action="digit" data-value="6">6</button>

      <button type="button" class="btn btn-digit" data-action="digit" data-value="1">1</button>
      <button type="button" class="btn btn-digit" data-action="digit" data-value="2">2</button>
      <button type="button" class="btn btn-digit" data-action="digit" data-value="3">3</button>
      <button type="button" class="btn btn-equals" data-action="equals" aria-label="Equals">=</button>

      <button type="button" class="btn btn-digit btn-zero" data-action="digit" data-value="0">0</button>
      <button type="button" class="btn btn-digit" data-action="decimal">.</button>
    </div>
  </main>
  <script src="script.js"></script>
</body>
</html>
